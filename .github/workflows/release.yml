name: Release

# Tag a commit `vX.Y.Z` (or run manually with a tag) to build a signed release APK and publish
# it as a GitHub release. Signing uses the same secrets RapidRawCloud's android build uses:
#   ANDROID_KEY_BASE64   base64 of the .jks keystore
#   ANDROID_KEY_ALIAS    key alias
#   ANDROID_KEY_PASSWORD keystore + key password
# Without them the APK is signed with a throwaway debug key (installable, but updates will not
# install over a previous release signed with a different key).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: ver
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          name="${tag#v}"
          IFS='.-' read -r major minor patch _ <<< "$name"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version $name (code $code) from $tag"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :esploader:test --no-daemon

      - name: Set up signing
        id: signing
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            {
              echo "storeFile=$RUNNER_TEMP/keystore.jks"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEY_BASE64 not set - release APK will be signed with a debug key"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} --no-daemon

      - name: Package artifacts
        id: pkg
        run: |
          mkdir -p dist
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-debugsigned"
          apk="dist/AndroidEspTools-${{ steps.ver.outputs.name }}${suffix}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.ver.outputs.name }}.txt" || true
          (cd dist && sha256sum *.apk > SHA256SUMS)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AndroidEspTools ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/mapping-*.txt
