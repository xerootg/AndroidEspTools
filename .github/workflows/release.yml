name: Release

# Every push to `main` is a release candidate: the next version is derived from the commits since
# the last `v*` tag (see "Versioning" in README.md), the commit is tagged, a release APK is built and
# a GitHub release is published. Nothing happens if the head of main is already tagged or there are
# no commits since the last tag.
#
# Manual runs (workflow_dispatch) can force a bump level or an explicit version, e.g. to cut the very
# first release or a hotfix from another branch.
#
# Signing secrets:
#   ANDROID_KEY_BASE64   base64 of the .jks keystore
#   ANDROID_KEY_ALIAS    key alias
#   ANDROID_KEY_PASSWORD keystore + key password
# Without them the APK is signed with a throwaway debug key (installable, but updates will not
# install over a previous release signed with a different key).
on:
  push:
    branches: [main]
    # Documentation-only pushes do not release; they land in the next release's notes.
    paths-ignore: ['**.md', 'docs/**', 'obtainium.json', 'LICENSE']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump level (auto = derive from commit messages)'
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      version:
        description: 'Explicit version X.Y.Z (overrides bump)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.calc.outputs.release }}
      version: ${{ steps.calc.outputs.version }}
      code: ${{ steps.calc.outputs.code }}
      previous: ${{ steps.calc.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: calc
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          head=$(git rev-parse HEAD)
          echo "last tag: ${last:-<none>}"

          if [ -n "$INPUT_VERSION" ]; then
            next="${INPUT_VERSION#v}"
            [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$INPUT_VERSION' is not X.Y.Z"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then echo "::error::tag v$next already exists"; exit 1; fi
          else
            if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$head" ]; then
              echo "HEAD is already released as $last; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            range=""; [ -n "$last" ] && range="$last..HEAD"
            # shellcheck disable=SC2086
            log=$(git log --format='%s%n%b' $range)
            count=$(git rev-list --count ${range:-HEAD})
            if [ "$count" = "0" ]; then
              echo "No commits since $last; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            bump="$INPUT_BUMP"
            if [ "$bump" = "auto" ]; then
              bump=patch
              if echo "$log" | grep -Eiq '^(feat|feature)(\(.*\))?:'; then bump=minor; fi
              if echo "$log" | grep -Eq '^[a-z]+(\(.*\))?!:|^BREAKING[ -]CHANGE'; then bump=major; fi
            fi
            if [ -z "$last" ]; then
              base="0.0.0"
            else
              base="${last#v}"; base="${base%%-*}"
            fi
            IFS=. read -r major minor patch <<< "$base"
            # 0.x: breaking changes bump the minor version, the API is not stable yet.
            if [ "$bump" = "major" ] && [ "$major" = "0" ]; then bump=minor; fi
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
            [ -n "$last" ] || next="0.1.0"
            echo "bump=$bump ($count commit(s) since ${last:-start})"
          fi

          IFS='.-' read -r major minor patch _ <<< "$next"
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "release=true"
            echo "version=$next"
            echo "code=$code"
            echo "previous=$last"
          } >> "$GITHUB_OUTPUT"
          echo "next version: $next (versionCode $code)"

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :esploader:test --no-daemon

      - name: Set up signing
        id: signing
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            {
              echo "storeFile=$RUNNER_TEMP/keystore.jks"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEY_BASE64 not set - release APK will be signed with a debug key"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ needs.version.outputs.version }} -PversionCode=${{ needs.version.outputs.code }} --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-debugsigned"
          cp app/build/outputs/apk/release/app-release.apk "dist/AndroidEspTools-${{ needs.version.outputs.version }}${suffix}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ needs.version.outputs.version }}.txt" || true
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist

      - name: Release notes from CHANGELOG.md
        run: |
          # Body = "Unreleased" section of the changelog (if any), then GitHub's generated notes.
          awk '/^## /{ if (found) exit } /^## \[?Unreleased/{ found=1; next } found' CHANGELOG.md 2>/dev/null \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > dist/notes.md || true
          if [ -s dist/notes.md ]; then
            printf '%s\n\n' "$(cat dist/notes.md)" > dist/body.md
          else
            : > dist/body.md
          fi
          printf '**APK**: `AndroidEspTools-%s%s.apk` (versionCode %s). Verify with `SHA256SUMS`.\n' \
            "${{ needs.version.outputs.version }}" "$([ "${{ steps.signing.outputs.signed }}" = true ] || echo -debugsigned)" "${{ needs.version.outputs.code }}" >> dist/body.md
          cat dist/body.md

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.version.outputs.version }}" -m "AndroidEspTools ${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: AndroidEspTools ${{ needs.version.outputs.version }}
          body_path: dist/body.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/mapping-*.txt
